org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.5.2 kennt API 36 (Android 16) noch nicht offiziell. Google Play verlangt targetSdk 36
# seit dem 31.08.2026; bauen laesst es sich trotzdem, AGP warnt nur. Beim naechsten AGP-Update
# (ab 8.10) kann die Zeile weg.
android.suppressUnsupportedCompileSdk=36

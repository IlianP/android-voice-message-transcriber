name: Release-APK

# Baut bei jedem Merge nach main ein signiertes Release-APK und veroeffentlicht
# es als GitHub Release. Manuell ausloesbar ueber "Run workflow".
#
# paths-ignore verhindert Leerlauf-Releases: Aendert ein Push ausschliesslich
# Markdown-Dateien, die LICENSE, Claude-Tooling (.claude/) oder die Workflows
# selbst (.github/), fliesst das nicht in die APK ein, also lohnt sich kein
# neuer Build. Aendert sich zusaetzlich auch nur eine einzige andere Datei,
# greift der Ausschluss nicht und der Workflow laeuft ganz normal - genau wie
# das noetig ist, wenn README oder CLAUDE.md im selben Merge wie ein Code-Fix
# aktualisiert werden. Dieser Workflow selbst bleibt ueber "Run workflow"
# jederzeit von Hand ausloesbar.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

# Zwei gleichzeitige Releases wuerden sich um denselben Tag streiten.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ohne Keystore wuerde der Build stillschweigend mit dem Debug-Key
      # signieren - das APK liesse sich dann nicht ueber eine bestehende
      # Installation aktualisieren. Also lieber frueh und laut abbrechen.
      - name: Keystore-Secrets pruefen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Repository-Secrets:$missing - siehe README, Abschnitt 'Release-Signierung einrichten'."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Version bestimmen
        id: version
        run: |
          version_name="1.0.${{ github.run_number }}"
          echo "name=$version_name"    >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name"    >> "$GITHUB_OUTPUT"
          echo "apk=Audio-Transkript-$version_name.apk" >> "$GITHUB_OUTPUT"
          echo "aab=Audio-Transkript-$version_name.aab" >> "$GITHUB_OUTPUT"

      # Dasselbe Build fuer GitHub (APK) und Google Play (AAB): beide tragen damit denselben
      # versionCode (= Lauf-Nummer). Play lehnt doppelte oder kleinere versionCodes ab.
      - name: Release-APK und -AAB bauen
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: APK benennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "${{ steps.version.outputs.apk }}"

      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.apk }}" \
            --title "Audio-Transkript ${{ steps.version.outputs.name }}" \
            --generate-notes

      # Erst nach dem GitHub-Release: ein Problem mit dem Play-Bundle darf die Verteilung ueber
      # GitHub/Obtainium nicht aufhalten.
      # Google Play nimmt das AAB mit dem Upload-Key entgegen und signiert die ausgelieferten
      # APKs selbst - mit dem hochgeladenen Release-Key, damit Play- und GitHub-Installationen
      # einander aktualisieren koennen (docs/play-store/02-technik.md). Sind keine Upload-Key-
      # Secrets hinterlegt, bleibt das AAB mit dem Release-Key signiert.
      - name: AAB mit Upload-Key signieren (optional)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::notice::Keine Upload-Key-Secrets - das AAB bleibt mit dem Release-Key signiert."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Alte Signatur entfernen, sonst traegt das Bundle zwei.
          zip -q -d "$aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.MF' || true
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env UPLOAD_KEYSTORE_PASSWORD -keypass:env UPLOAD_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$UPLOAD_KEY_ALIAS"
          jarsigner -verify "$aab" > /dev/null

      # Als Workflow-Artefakt, nicht als Release-Asset: Obtainium und Nutzer sollen auf der
      # Release-Seite nur das installierbare APK finden.
      - name: AAB fuer Google Play bereitstellen
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "${{ steps.version.outputs.aab }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Transkript-${{ steps.version.outputs.name }}-aab
          path: ${{ steps.version.outputs.aab }}
          retention-days: 90
          if-no-files-found: error

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/upload.jks"
